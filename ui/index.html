<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>LifeHarness</title>
<style>
  :root {
    --bg: #f6f5f2; --card: rgba(255, 255, 255, .86); --ink: #1d1d1f; --muted: #6e6e73; --line: #e5e3de;
    --work: #8e8e93; --class: #7c4dff; --school: #2f6fed; --exercise: #f08a24;
    --social: #e0457b; --chore: #2e9e6b; --free: #b8b8bd;
    --proposed: #b26b00; --proposed-bg: #fff4e0; --saved: #2e7d32; --saved-bg: #e8f5e9;
  }
  * { box-sizing: border-box; }
  body { margin: 0; font: 15px/1.45 -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
         background: var(--bg); color: var(--ink); }
  /* Muted rotating Windows Spotlight background */
  .bg { position: fixed; inset: -20px; z-index: -1; background: center / cover no-repeat;
        opacity: 0; transition: opacity 2.5s ease; filter: saturate(.5) blur(2px) brightness(1.05); }
  .bg.show { opacity: .32; }
  .chip, .item, .box, .commute { backdrop-filter: blur(8px); -webkit-backdrop-filter: blur(8px); }
  @media (prefers-reduced-motion: reduce) { .bg { transition: none; } }
  #bg-caption { position: fixed; right: 12px; bottom: 10px; max-width: 45vw; font: inherit; font-size: 11px;
                color: var(--muted); background: rgba(255, 255, 255, .7); padding: 3px 8px; border: 0;
                border-radius: 6px; cursor: zoom-in; text-align: right; }
  #bg-caption:hover { color: var(--ink); background: rgba(255, 255, 255, .92); }
  #bg-caption:empty { display: none; }
  /* Intro: today's photo full-screen on page open, then it fades into the background */
  #intro { position: fixed; inset: 0; z-index: 20; background: #000 center / cover no-repeat; cursor: pointer;
           opacity: 1; transition: opacity 1s ease, filter 1s ease, transform 1s ease; }
  #intro.fade { opacity: 0; filter: saturate(.5) blur(2px); transform: scale(1.03); pointer-events: none; }
  #intro .intro-cap { position: absolute; left: 28px; bottom: 26px; color: #fff; text-shadow: 0 2px 12px rgba(0,0,0,.7); }
  #intro .intro-cap b { display: block; font-size: 22px; letter-spacing: -.01em; }
  #intro .intro-cap span { font-size: 12px; opacity: .85; }
  /* Full-photo viewer */
  #viewer { position: fixed; inset: 0; z-index: 10; background: rgba(0, 0, 0, .92); display: none;
            flex-direction: column; align-items: center; justify-content: center; gap: 12px; cursor: zoom-out; }
  #viewer.open { display: flex; }
  #viewer img { max-width: 96vw; max-height: 86vh; object-fit: contain; border-radius: 6px; box-shadow: 0 10px 40px #000; }
  #viewer .meta { color: #eee; font-size: 14px; text-align: center; }
  #viewer .meta .credit { color: #aaa; font-size: 12px; margin-top: 2px; }
  #viewer .hint { color: #777; font-size: 11px; }
  main { max-width: 560px; margin: 0 auto; padding: 28px 20px 48px; }
  .status { display: inline-flex; align-items: center; gap: 8px; padding: 6px 12px; border-radius: 999px;
            font-size: 13px; font-weight: 600; margin-bottom: 14px; }
  .status.proposed { color: var(--proposed); background: var(--proposed-bg); }
  .status.saved { color: var(--saved); background: var(--saved-bg); }
  .status .dot { width: 8px; height: 8px; border-radius: 50%; background: currentColor; }
  .status.proposed .dot { animation: pulse 1.4s infinite; }
  @keyframes pulse { 50% { opacity: .25; } }
  h1 { font-size: 30px; margin: 0; letter-spacing: -.02em; }
  .date { color: var(--muted); margin: 2px 0 6px; }
  .headline { font-size: 17px; margin: 10px 0 18px; }
  .row { display: flex; gap: 10px; margin-bottom: 18px; }
  .chip { flex: 1; background: var(--card); border: 1px solid var(--line); border-radius: 12px; padding: 10px 12px; }
  .chip .label { font-size: 11px; text-transform: uppercase; letter-spacing: .06em; color: var(--muted); }
  .chip .value { font-weight: 600; margin-top: 2px; }
  .alert { margin-top: 4px; color: #c62828; font-size: 13px; font-weight: 600; }
  .bar { height: 6px; background: var(--line); border-radius: 3px; margin-top: 6px; overflow: hidden; }
  .bar > div { height: 100%; background: var(--school); }
  .behind .bar > div { background: #e65100; }
  h2 { font-size: 12px; text-transform: uppercase; letter-spacing: .08em; color: var(--muted); margin: 22px 0 8px; }
  .item { display: flex; gap: 12px; background: var(--card); border: 1px solid var(--line);
          border-left: 4px solid var(--free); border-radius: 10px; padding: 10px 12px; margin-bottom: 8px; }
  .item .time { width: 92px; flex-shrink: 0; color: var(--muted); font-variant-numeric: tabular-nums; font-size: 13px; padding-top: 1px; }
  .item .title { font-weight: 600; }
  .item .note { font-size: 13px; color: var(--proposed); margin-top: 2px; }
  .item.now { box-shadow: 0 0 0 2px var(--school); }
  .item.past { opacity: .5; }
  ul { margin: 0; padding: 0; list-style: none; }
  .box { background: var(--card); border: 1px solid var(--line); border-radius: 10px; padding: 4px 12px; }
  .box li { padding: 8px 0; border-bottom: 1px solid var(--line); }
  .box li:last-child { border-bottom: 0; }
  .suggest li::before { content: "→ "; color: var(--proposed); font-weight: 700; }
  .cal-link { display: inline-block; margin-top: 6px; padding: 5px 10px; border-radius: 8px; font-size: 13px;
              font-weight: 600; color: #1a56db; background: #eaf1ff; text-decoration: none; }
  .cal-link:hover { background: #dbe7ff; }
  .commute { display: flex; align-items: center; justify-content: space-between; gap: 12px;
             background: var(--card); border: 1px solid var(--line); border-radius: 12px; padding: 10px 12px; margin-bottom: 4px; }
  .commute .label { font-size: 11px; text-transform: uppercase; letter-spacing: .06em; color: var(--muted); }
  .commute .value { font-weight: 600; margin-top: 2px; }
  .commute .sub { font-size: 13px; color: var(--muted); }
  .commute .cal-link { margin-top: 0; white-space: nowrap; }
  .commute.off { opacity: .6; }
  .commute + .commute { margin-top: 8px; }
  .card-links { display: flex; flex-direction: column; gap: 6px; align-items: stretch; }
  .card-links .cal-link { text-align: center; }
  .suggest li { display: flex; flex-direction: column; align-items: flex-start; }
  .suggest li::before { display: none; }
  /* Weather chip (clickable) + hourly forecast */
  .chip-btn { font: inherit; color: inherit; text-align: left; cursor: pointer; }
  .chip-btn:hover { border-color: var(--school); }
  .hourly { background: var(--card); border: 1px solid var(--line); border-radius: 12px; padding: 10px 12px;
            margin: -8px 0 12px; backdrop-filter: blur(8px); -webkit-backdrop-filter: blur(8px); }
  .hourly-head { display: flex; justify-content: space-between; align-items: baseline; font-size: 14px; margin-bottom: 6px; }
  .hourly-head span { font-size: 12px; color: var(--muted); }
  .hourly-strip { display: flex; gap: 4px; overflow-x: auto; padding-bottom: 6px; }
  .hour { flex: 0 0 52px; text-align: center; border-radius: 8px; padding: 6px 0; font-variant-numeric: tabular-nums; }
  .hour.wet { background: rgba(47, 111, 237, .07); }
  .hour.storm { background: rgba(198, 40, 40, .09); box-shadow: inset 0 0 0 1.5px rgba(198, 40, 40, .45); }
  .hour-t { font-size: 11px; color: var(--muted); }
  .hour-i { font-size: 18px; line-height: 1.5; }
  .hour-temp { font-weight: 600; font-size: 14px; }
  .hour-bar { height: 28px; width: 8px; margin: 4px auto 2px; background: var(--line); border-radius: 4px;
              display: flex; align-items: flex-end; overflow: hidden; }
  .hour-bar > div { width: 100%; background: var(--school); }
  .hour-rain, .hour-hum { font-size: 10px; color: var(--muted); white-space: nowrap; }
  .hourly-legend { display: flex; justify-content: space-between; gap: 8px; font-size: 11px; color: var(--muted); margin-top: 4px; }
  .storm-note { color: #c62828; font-weight: 600; }
  /* To-dos */
  .todos .todo-row { display: flex; align-items: center; gap: 10px; }
  .todos input[type=checkbox] { width: 17px; height: 17px; accent-color: var(--saved); cursor: pointer; flex-shrink: 0; }
  .todo-text { flex: 1; text-align: left; background: none; border: 0; padding: 0; font: inherit; color: inherit; cursor: pointer; }
  .todo-text:hover { color: var(--school); }
  .todo.done .todo-text { text-decoration: line-through; color: var(--muted); }
  .todo-count { font-size: 12px; color: var(--muted); }
  .todo-latest { font-size: 13px; color: var(--muted); margin: 2px 0 0 27px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .todo-notes { margin: 8px 0 2px 27px; padding-left: 10px; border-left: 2px solid var(--line); }
  .todo-note { font-size: 13px; margin-bottom: 6px; }
  .todo-when { display: block; font-size: 11px; color: var(--muted); }
  .todo-empty { color: var(--muted); }
  .todo-warn { padding: 10px 12px; color: #c62828; }
  .todo-form { display: flex; gap: 6px; margin-top: 8px; }
  .todo-form input { flex: 1; font: inherit; font-size: 14px; padding: 6px 10px; border: 1px solid var(--line);
                     border-radius: 8px; background: rgba(255,255,255,.9); }
  .todo-form button { font: inherit; font-size: 13px; font-weight: 600; padding: 6px 12px; border: 0; border-radius: 8px;
                      background: #eaf1ff; color: #1a56db; cursor: pointer; }
  .todo-done { margin-top: 10px; }
  .todo-done summary { cursor: pointer; font-size: 12px; color: var(--muted); text-transform: uppercase; letter-spacing: .08em; }
  .todo-done .box { margin-top: 6px; }
  .ahead li b { display: inline-block; width: 44px; }
  .empty { color: var(--muted); text-align: center; margin-top: 80px; }
  footer { color: var(--muted); font-size: 12px; margin-top: 26px; text-align: center; }
</style>
</head>
<body>
<div class="bg" id="bg0"></div><div class="bg" id="bg1"></div>
<button id="bg-caption" type="button" title="View full photo"></button>
<div id="viewer" role="dialog" aria-label="Full photo">
  <img alt="">
  <div class="meta"><div class="place"></div><div class="credit"></div></div>
  <div class="hint">Click anywhere or press Esc to close</div>
</div>
<main id="app"><p class="empty">Waiting for your first check-in…<br>Say “good morning” to Claude.</p></main>
<script>
const COLORS = { work: "--work", class: "--class", school: "--school", exercise: "--exercise",
                 social: "--social", chore: "--chore", free: "--free" };

function el(tag, cls, text) {
  const n = document.createElement(tag);
  if (cls) n.className = cls;
  if (text != null) n.textContent = text;
  return n;
}

function fmt(hhmm) {
  if (!hhmm) return "";
  let [h, m] = hhmm.split(":").map(Number);
  const ap = h >= 12 ? "PM" : "AM";
  h = h % 12 || 12;
  return `${h}:${String(m).padStart(2, "0")} ${ap}`;
}

function chicagoNow() {
  const parts = new Intl.DateTimeFormat("en-CA", { timeZone: "America/Chicago", year: "numeric",
    month: "2-digit", day: "2-digit", hour: "2-digit", minute: "2-digit", hour12: false })
    .formatToParts(new Date()).reduce((a, p) => (a[p.type] = p.value, a), {});
  return { date: `${parts.year}-${parts.month}-${parts.day}`, time: `${parts.hour}:${parts.minute}` };
}

function list(title, items, cls, render) {
  if (!items || !items.length) return null;
  const frag = document.createDocumentFragment();
  frag.append(el("h2", null, title));
  const ul = el("ul", `box ${cls}`);
  items.forEach(i => ul.append(render(i)));
  frag.append(ul);
  return frag;
}

// Google account for calendar links, from the git-ignored .env (via /api/config).
let GOOGLE_ACCOUNT = "";
fetch("/api/config").then(r => r.json())
  .then(c => { GOOGLE_ACCOUNT = c.google_account || ""; last = ""; poll(); })
  .catch(() => {});

// Only link to Google Calendar, never anywhere else; open it in the right account.
function safeCalendarLink(url) {
  try {
    const u = new URL(url);
    if (u.protocol !== "https:" || !["www.google.com", "calendar.google.com"].includes(u.hostname)) return null;
    if (GOOGLE_ACCOUNT) u.searchParams.set("authuser", GOOGLE_ACCOUNT);
    return u.href;
  } catch { return null; }
}

function renderSuggestion(s) {
  const li = el("li");
  if (typeof s === "string") { li.append(s); return li; }
  li.append(s.text);
  const href = s.event_link && safeCalendarLink(s.event_link);
  if (href) {
    const a = el("a", "cal-link", `Edit ${s.event_title || "event"} in Google Calendar ↗`);
    a.href = href; a.target = "_blank"; a.rel = "noopener noreferrer";
    li.append(a);
  }
  return li;
}

// Morning drive. Neighborhood-level, not exact addresses.
const COMMUTE = {
  from: "River North", to: "Elk Grove Village", leave: "7:20 AM", usual: "~40 min",
  url: "https://www.google.com/maps/dir/?api=1&origin=River+North,+Chicago,+IL" +
       "&destination=Elk+Grove+Village,+IL&travelmode=driving",
};

function renderCommute(plan) {
  const workday = (plan.timeline || []).some(t => t.kind === "work");
  const card = el("div", `commute ${workday ? "" : "off"}`);
  const text = el("div");
  text.append(el("div", "label", "Commute"),
              el("div", "value", `${COMMUTE.from} → ${COMMUTE.to}`),
              el("div", "sub", workday ? `Leave ${COMMUTE.leave} · usually ${COMMUTE.usual}`
                                       : "No work today"));
  const a = el("a", "cal-link", "Check live traffic ↗");
  a.href = COMMUTE.url; a.target = "_blank"; a.rel = "noopener noreferrer";
  card.append(text, a);
  return card;
}

// ---- To-dos (notes/todos.json): tick to finish, click to open progress notes ----
const expanded = new Set();   // which to-dos have their notes open (kept across re-renders)

function when(iso) {
  return iso ? new Date(iso).toLocaleString("en-US", { month: "short", day: "numeric",
    hour: "numeric", minute: "2-digit" }) : "";
}

async function todoAction(action, body) {
  try {
    const r = await fetch("/api/todos/" + action, { method: "POST",
      headers: { "Content-Type": "application/json" }, body: JSON.stringify(body) });
    if (!r.ok) alert("Couldn't save that change (" + r.status + "). Is the server running?");
  } catch { alert("Couldn't reach the server. Is it running?"); }
  last = ""; poll();   // re-render with the saved state
}

function inputForm(placeholder, button, onSubmit) {
  const f = el("form", "todo-form");
  const input = el("input"); input.placeholder = placeholder; input.maxLength = 1000;
  f.append(input, el("button", null, button));
  f.addEventListener("submit", e => {
    e.preventDefault();
    const v = input.value.trim();
    if (v) { input.value = ""; onSubmit(v); }
  });
  return f;
}

function renderTodo(t) {
  const li = el("li", `todo ${t.done ? "done" : ""}`);
  const row = el("div", "todo-row");
  const box = el("input"); box.type = "checkbox"; box.checked = !!t.done;
  box.title = t.done ? "Reopen" : "Mark done";
  box.addEventListener("change", () => todoAction("toggle", { id: t.id }));
  const text = el("button", "todo-text", t.text); text.type = "button";
  text.title = "Show progress notes";
  text.addEventListener("click", () => {
    expanded.has(t.id) ? expanded.delete(t.id) : expanded.add(t.id);
    last = ""; poll();
  });
  const notes = t.notes || [];
  row.append(box, text);
  if (notes.length) row.append(el("span", "todo-count", `📝 ${notes.length}`));
  li.append(row);

  if (expanded.has(t.id)) {
    const box2 = el("div", "todo-notes");
    notes.forEach(n => {
      const p = el("div", "todo-note");
      p.append(el("span", "todo-when", `${when(n.at)}${n.by ? " · " + n.by : ""}`), el("span", null, n.text));
      box2.append(p);
    });
    if (!t.done) box2.append(inputForm("Add a progress note…", "Add note", v => todoAction("note", { id: t.id, text: v })));
    li.append(box2);
  } else if (notes.length && !t.done) {
    li.append(el("div", "todo-latest", notes[notes.length - 1].text));
  }
  return li;
}

function renderTodos(todos) {
  const frag = document.createDocumentFragment();
  frag.append(el("h2", null, "To-dos"));
  if (todos === null) {
    frag.append(el("div", "box todo-warn", "notes/todos.json couldn't be read. Ask Claude to fix it."));
    return frag;
  }
  const open = todos.filter(t => !t.done);
  const done = todos.filter(t => t.done).sort((a, b) => (b.done_at || "").localeCompare(a.done_at || ""));
  const ul = el("ul", "box todos");
  open.forEach(t => ul.append(renderTodo(t)));
  if (!open.length) ul.append(el("li", "todo-empty", "Nothing open. 🎉"));
  frag.append(ul, inputForm("Add a to-do…", "Add", v => todoAction("add", { text: v })));
  if (done.length) {
    const d = el("details", "todo-done");
    d.open = expanded.has("__done__");
    d.addEventListener("toggle", () => d.open ? expanded.add("__done__") : expanded.delete("__done__"));
    d.append(el("summary", null, `Done (${done.length})`));
    const dl = el("ul", "box todos");
    done.forEach(t => dl.append(renderTodo(t)));
    d.append(dl);
    frag.append(d);
  }
  return frag;
}

// ---- Hourly weather (click the Weather chip) ----
// Reads the same weather file Claude plans from, via /api/weather (read-only).
let weatherOpen = false, weatherData = null;
const WX_ICON = c => c === 0 ? "☀️" : c <= 2 ? "🌤️" : c === 3 ? "☁️" : c <= 48 ? "🌫️" : c <= 57 ? "🌦️"
  : c <= 67 ? "🌧️" : c <= 77 ? "🌨️" : c <= 82 ? "🌧️" : c <= 86 ? "🌨️" : "⛈️";
const WX_STORM = c => c >= 95;

async function loadWeather() {
  try { weatherData = await (await fetch("/api/weather", { cache: "no-store" })).json(); }
  catch { weatherData = null; }
  last = ""; poll();
}

function renderHourly(plan) {
  const box = el("div", "hourly");
  const h = weatherData && weatherData.hourly;
  if (!h) { box.append(el("div", "cal-none", "Loading the forecast…")); return box; }

  // Plan for today (or a past day, or a day not in the forecast): the next 24 h from now.
  // Plan for a future day in the forecast: 6 AM–11 PM of that day.
  const now = chicagoNow();
  const all = h.time.map((t, i) => i);
  const planDay = all.filter(i => h.time[i].startsWith(plan.date) && +h.time[i].slice(11, 13) >= 6);
  const isToday = plan.date <= now.date || !planDay.length;
  const idx = isToday ? all.filter(i => h.time[i] >= `${now.date}T${now.time.slice(0, 2)}:00`).slice(0, 24)
                      : planDay.slice(0, 18);
  if (!idx.length) { box.append(el("div", "cal-none", "No forecast for this day yet. It refreshes at your next check-in.")); return box; }

  const hasHum = Array.isArray(h.relative_humidity_2m);
  const head = el("div", "hourly-head");
  head.append(el("b", null, isToday ? "Next 24 hours" : `${plan.weekday}, hour by hour`),
              el("span", null, `as of ${weatherData.current ? fmt(weatherData.current.time.slice(11, 16)) : "last check-in"}`));
  box.append(head);

  const strip = el("div", "hourly-strip");
  idx.forEach(i => {
    const code = h.weather_code[i], rain = h.precipitation_probability[i];
    const col = el("div", `hour ${WX_STORM(code) ? "storm" : ""} ${rain >= 50 ? "wet" : ""}`);
    col.title = WX_STORM(code) ? "Thunderstorm" : "";
    col.append(el("div", "hour-t", fmt(h.time[i].slice(11, 16)).replace(":00", "")),
               el("div", "hour-i", WX_ICON(code)),
               el("div", "hour-temp", `${Math.round(h.temperature_2m[i])}°`));
    const bar = el("div", "hour-bar"), fill = el("div");
    fill.style.height = `${rain}%`; bar.append(fill);
    col.append(bar, el("div", "hour-rain", `💧${rain}%`),
               el("div", "hour-hum", hasHum ? `${Math.round(h.relative_humidity_2m[i])}% RH` : "–"));
    strip.append(col);
  });
  box.append(strip);

  const storms = idx.filter(i => WX_STORM(h.weather_code[i]));
  const legend = el("div", "hourly-legend");
  legend.append(el("span", null, "🌡 temp · 💧 chance of rain · RH humidity"),
                el("span", storms.length ? "storm-note" : null,
                   storms.length ? `⛈ Storms around ${fmt(h.time[storms[0]].slice(11, 16))}` : "No storms expected"));
  box.append(legend);
  if (!hasHum) box.append(el("div", "cal-none", "Humidity isn't in the weather data yet. It appears once the weather script requests it."));
  return box;
}

// Calendar card: quick links so Khang can add/move/delete events in Google Calendar
// (Claude never edits the calendar; Khang does, then says "replan").
function renderCalendar(plan) {
  const [y, m, d] = (plan.date || "").split("-").map(Number);
  const dayUrl = y ? `https://calendar.google.com/calendar/r/day/${y}/${m}/${d}` : "https://calendar.google.com/calendar/r";
  const card = el("div", "commute calendar");
  const text = el("div");
  text.append(el("div", "label", "Calendar"),
              el("div", "value", "LifeHarness"),
              el("div", "sub", "Changed something? Say “replan” to Claude."));
  const links = el("div", "card-links");
  [["Open calendar ↗", dayUrl], ["+ Add event ↗", "https://calendar.google.com/calendar/r/eventedit"]]
    .forEach(([label, href]) => {
      const a = el("a", "cal-link", label);
      a.href = safeCalendarLink(href); a.target = "_blank"; a.rel = "noopener noreferrer";
      links.append(a);
    });
  card.append(text, links);
  return card;
}

function render({ proposed, saved, todos }) {
  const app = document.getElementById("app");
  const plan = proposed || saved;
  app.replaceChildren();
  if (!plan) {
    app.append(el("p", "empty", "Waiting for your first check-in… Say “good morning” to Claude."));
    if (todos !== undefined) app.append(renderTodos(todos));
    return;
  }
  const isProposed = !!proposed;
  const badge = el("div", `status ${isProposed ? "proposed" : "saved"}`);
  badge.append(el("span", "dot"), el("span", null,
    isProposed ? "Proposed: waiting for your OK" : "Saved plan"));
  app.append(badge);

  const [y, mo, d] = plan.date.split("-").map(Number);
  const label = new Date(y, mo - 1, d).toLocaleDateString("en-US", { month: "long", day: "numeric" });
  app.append(el("h1", null, plan.weekday || "Today"), el("div", "date", label));
  if (plan.headline) app.append(el("div", "headline", plan.headline));

  const row = el("div", "row");
  if (plan.weather) {
    const c = el("button", "chip chip-btn"); c.type = "button";
    c.title = weatherOpen ? "Hide hourly forecast" : "Show hourly forecast";
    c.append(el("div", "label", `Weather · hourly ${weatherOpen ? "▴" : "▾"}`), el("div", "value", plan.weather.summary));
    if (plan.weather.alert) c.append(el("div", "alert", "⚠ " + plan.weather.alert));
    c.addEventListener("click", () => {
      weatherOpen = !weatherOpen;
      if (weatherOpen) loadWeather(); else { last = ""; poll(); }
    });
    row.append(c);
  }
  if (plan.assignment) {
    const a = plan.assignment;
    const c = el("div", `chip ${a.status === "behind" ? "behind" : ""}`);
    const due = a.due ? new Date(a.due).toLocaleString("en-US", { weekday: "short", hour: "numeric",
      minute: "2-digit", timeZone: "America/Chicago" }) : "";
    c.append(el("div", "label", `${a.name} · due ${due}`),
             el("div", "value", `Step ${a.step} of ${a.total_steps} · ${a.status}`));
    const bar = el("div", "bar"), fill = el("div");
    fill.style.width = `${Math.round(((a.step - 1) / a.total_steps) * 100)}%`;
    bar.append(fill); c.append(bar); row.append(c);
  }
  app.append(row);
  if (weatherOpen) app.append(renderHourly(plan));
  app.append(renderCommute(plan));
  app.append(renderCalendar(plan));

  app.append(el("h2", null, "Timeline"));
  const now = chicagoNow();
  (plan.timeline || []).forEach(t => {
    const item = el("div", "item");
    item.style.borderLeftColor = `var(${COLORS[t.kind] || "--free"})`;
    if (plan.date === now.date) {
      if (t.end && t.end <= now.time) item.classList.add("past");
      else if (t.start <= now.time && (!t.end || now.time < t.end)) item.classList.add("now");
    }
    const body = el("div");
    body.append(el("div", "title", t.title));
    if (t.note) body.append(el("div", "note", t.note));
    item.append(el("div", "time", t.end ? `${fmt(t.start)} – ${fmt(t.end)}` : fmt(t.start)), body);
    app.append(item);
  });

  const sugg = list("Suggestions: you make these changes", plan.suggestions, "suggest", renderSuggestion);
  if (sugg) app.append(sugg);
  if (todos !== undefined) app.append(renderTodos(todos));
  const ahead = list("Look ahead", plan.look_ahead, "ahead", s => { const li = el("li"); li.append(el("b", null, s.day), s.plan); return li; });
  if (ahead) app.append(ahead);

  const savedWhen = plan.saved_at ? new Date(plan.saved_at).toLocaleString("en-US",
    { weekday: "short", hour: "numeric", minute: "2-digit", timeZone: "America/Chicago" }) : "";
  app.append(el("footer", null, `${isProposed ? "Proposed" : "Saved"} ${savedWhen} · updates automatically`));
}

// Don't redraw while you're typing (it would wipe the text box); catch up when you're done.
let last = "", pending = null;
function typing() {
  const a = document.activeElement;
  return a && a.tagName === "INPUT" && a.type !== "checkbox" && a.value.trim() !== "";
}
document.addEventListener("focusout", () => setTimeout(() => {
  if (pending && !typing()) { const s = pending; pending = null; render(s); }
}, 0));
async function poll() {
  try {
    const r = await fetch("/api/state", { cache: "no-store" });
    const text = await r.text();
    if (text !== last) {
      last = text;
      const s = JSON.parse(text);
      if (typing()) pending = s; else render(s);
    }
  } catch (e) { /* server restarting; try again */ }
}
poll();
setInterval(poll, 2000);

// One Windows Spotlight photo per day. The server fetches a new set when the date changes;
// the page shows the first one that loads, and checks hourly in case it's left open overnight.
const CHECK_MS = 60 * 60 * 1000;
function isMicrosoftImage(url) {
  try { const u = new URL(url); return u.protocol === "https:" && u.hostname.endsWith(".microsoft"); }
  catch { return false; }
}
// On page open: show today's photo full-screen and in full color, then fade it into the
// muted background. Click to skip. Skipped entirely if the system asks for reduced motion.
const INTRO_HOLD_MS = 250, INTRO_FADE_MS = 1000;
function playIntro(p) {
  if (window.matchMedia("(prefers-reduced-motion: reduce)").matches) return;
  const intro = el("div"); intro.id = "intro";
  intro.style.backgroundImage = `url("${p.url}")`;
  const cap = el("div", "intro-cap");
  if (p.place) cap.append(el("b", null, p.place));
  if (p.credit) cap.append(el("span", null, p.credit));
  intro.append(cap);
  document.body.append(intro);
  let gone = false;
  const fade = () => {
    if (gone) return; gone = true;
    intro.classList.add("fade");
    setTimeout(() => intro.remove(), INTRO_FADE_MS + 100);
  };
  const timer = setTimeout(fade, INTRO_HOLD_MS);
  intro.addEventListener("click", () => { clearTimeout(timer); fade(); });
}

async function startBackground() {
  const layers = [document.getElementById("bg0"), document.getElementById("bg1")];
  const caption = document.getElementById("bg-caption");
  let front = 0, current = null, currentPhoto = null;

  // Click the caption -> full, unmuted photo. Click or Esc to close.
  const viewer = document.getElementById("viewer");
  caption.addEventListener("click", () => {
    if (!currentPhoto) return;
    viewer.querySelector("img").src = currentPhoto.url;
    viewer.querySelector("img").alt = currentPhoto.place || "Background photo";
    viewer.querySelector(".place").textContent = currentPhoto.place || "";
    viewer.querySelector(".credit").textContent = currentPhoto.credit || "";
    viewer.classList.add("open");
  });
  viewer.addEventListener("click", () => viewer.classList.remove("open"));
  document.addEventListener("keydown", e => { if (e.key === "Escape") viewer.classList.remove("open"); });
  function display(photos, i = 0) {
    if (i >= photos.length) return;            // none loaded: keep what's showing
    const p = photos[i];
    if (p.url === current) return;             // same day, same photo: do nothing
    const img = new Image();
    img.onload = () => {
      const next = layers[1 - front];
      next.style.backgroundImage = `url("${p.url}")`;
      next.classList.add("show");
      layers[front].classList.remove("show");
      front = 1 - front;
      if (!current) playIntro(p);   // first photo since the page opened
      current = p.url;
      currentPhoto = p;
      caption.textContent = [p.place, p.credit].filter(Boolean).join(" · ");
    };
    img.onerror = () => display(photos, i + 1);  // broken image: use the day's next one
    img.src = p.url;
  }
  async function check() {
    try {
      const photos = (await (await fetch("/api/photos")).json()).filter(p => isMicrosoftImage(p.url));
      display(photos);
    } catch { /* offline: keep the current photo or plain background */ }
  }
  check();
  setInterval(check, CHECK_MS);
}
startBackground();
</script>
